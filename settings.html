<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <link rel="stylesheet" href="assets/css/settings.css">
</head>
<body>
    

    
    <main class="container">
        <aside class="sidebar">
            <div class="logo">
                <p>UI</p>
            </div>

            <div class="icons">
                <img class="home-picture" src="./assets/imgs/house-solid-full.svg" alt="home icon" />
                <img class="home-picture" src="./assets/imgs/chart-bar-solid-full.svg" alt="chart icon" />
                <img class="home-picture" src="./assets/imgs/chart-pie-solid-full.svg" alt="chart pie icon" />
                <img class="home-picture" src="./assets/imgs/inbox-solid-full.svg" alt="inbox icon" />
                <img class="home-picture" src="./assets/imgs/moon-regular-full.svg" alt="change theme icon" />
                <img class="home-picture" src="./assets/imgs/gear-solid-full.svg" alt="settings icon" />
            </div>
        </aside>

        <section class="page">
            <header class="search-and-notifications">
                <div class="search">
                    <img class="search-icon" src="assets/imgs/magnifying-glass-solid-full.svg" alt="search icon">
                </div>
                <div class="notification">
                    <img src="assets/imgs/bell-regular-full.svg" alt="notification icon">
                </div>
                <div class="profile">
                    <img src="assets/imgs/user-regular-full.svg" alt="profile icon">
                </div>
            </header>

            <section class="content">
                <h1 class="settings-title">Settings</h1>


               
            </section>
        </section>
    </main>
</body>
</html>

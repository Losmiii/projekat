<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings</title>
    <link rel="stylesheet" href="./assets/css/main.css" />
    <script src="settings.js" defer></script>
  </head>
  <body>
    <main class="container">
      <aside class="sidebar">
        <div class="logo">
          <p>UI</p>
        </div>

        <div class="icons">
          <a href="index.html" class="icon-link">
            <img
              class="home-picture"
              src="./assets/imgs/house-solid-full.svg"
              alt="home icon"
            />
          </a>
          <img
            class="home-picture"
            src="./assets/imgs/chart-bar-solid-full.svg"
            alt="chart icon"
          />
          <img
            class="home-picture"
            src="./assets/imgs/chart-pie-solid-full.svg"
            alt="chart pie icon"
          />
          <img
            class="home-picture"
            src="./assets/imgs/inbox-solid-full.svg"
            alt="inbox icon"
          />
          <img
            class="home-picture"
            id="theme-btn"
            src="./assets/imgs/moon-regular-full.svg"
            alt="change theme icon"
          />
          <a href="settings.html" class="icon-link">
            <img
              class="home-picture"
              src="./assets/imgs/gear-solid-full.svg"
              alt="settings icon"
            />
          </a>
        </div>
      </aside>

      <section class="page">
        <section class="content settings-content">
          <h1 class="table-name">Settings</h1>

          <div class="settings-card">
            <div class="setting-row">
              <div>
                <h3>Dark mode</h3>
                <p class="setting-desc">Switch between light and dark theme</p>
              </div>
              <input type="checkbox" id="darkToggle" />
            </div>

            <div class="setting-row">
              <div>
                <h3>Rows per page</h3>
                <p class="setting-desc">Default number of tasks per page</p>
              </div>
              <select class="page-number" id="defaultRows">
                <option value="4">4</option>
                <option value="8">8</option>
              </select>
            </div>

            <div class="setting-row">
              <div>
                <h3>Clear all tasks</h3>
                <p class="setting-desc">Deletes every saved task</p>
              </div>
              <button id="clearTasks" class="danger-btn">Clear</button>
            </div>
          </div>
        </section>
      </section>
    </main>
  </body>
</html>

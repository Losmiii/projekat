<!DOCTYPE html>

<html>

<body>

<h1>JavaScript Project</h1>

<h2>To-Do List</h2>



<button onclick="addTask()">Add task</button>

<button onclick="clearAll()">Clear All</button>



<table border="1">

  <thead>

    <tr>
      <th>#</th>
      <th>Task</th>
      <th>Action</th>
      <th>date</th>

    </tr>

  </thead>

  <tbody id="list"></tbody>

</table>



<script>

let tasks = [];

function displayTasks() {

  let html = "";

  for (let i = 0; i < tasks.length; i++) {

    html += "<tr>";

    html += "<td>" + (i + 1) + "</td>";

    html += "<td>" + tasks[i] + "</td>";

    html += "<td><"

    html += "<td><button onclick='removeTask(" + i + ")'>x</button></td>";

    html += "</tr>";

  }

  document.getElementById("list").innerHTML = html;

}


function addTask() {

  let text = prompt("Enter a new task:");

  if (text === null || text.trim() === "") {

    return;

  }

  tasks.push(text.trim());

  saveTasks();

  displayTasks();

}


function removeTask(i) {

  tasks.splice(i, 1);

  saveTasks();

  displayTasks();

}

function clearAll() {

  tasks = [];

  saveTasks();

  displayTasks();

}

function saveTasks() {

  localStorage.setItem("tasks", JSON.stringify(tasks));

}

function loadTasks() {

  let saved = localStorage.getItem("tasks");

  if (saved !== null) {

    tasks = JSON.parse(saved);

  }

}

loadTasks();

displayTasks();

</script>



</body>

</html>

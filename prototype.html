<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<style>
  .notification-wrapper {
  position: relative;
  display: inline-block;
  font-family: sans-serif;
}

.notification-btn {
  background: none;
  border: none;
  font-size: 1.25rem;
  cursor: pointer;
  position: relative;
}

.badge {
  position: absolute;
  top: -5px;
  right: -8px;
  background-color: #e53e3e;
  color: white;
  font-size: 0.70rem;
  padding: 2px 5px;
  border-radius: 999px;
}

.notification-dropdown {
  display: none; /* Hidden by default */
  position: absolute;
  right: 0;
  top: 40px;
  width: 280px;
  background: white;
  border: 1px solid #e2e8f0;
  border-radius: 8px;
  box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
  z-index: 100;
}

.notification-dropdown.active {
  display: block;
}

.dropdown-header {
  display: flex;
  justify-content: space-between;
  padding: 10px 12px;
  border-bottom: 1px solid #e2e8f0;
  font-weight: bold;
  font-size: 0.9rem;
}

.notification-list {
  list-style: none;
  margin: 0;
  padding: 0;
  max-height: 250px;
  overflow-y: auto;
}

.notification-list li {
  padding: 10px 12px;
  border-bottom: 1px. solid #f1f5f9;
  font-size: 0.85rem;
}

.notification-list li.unread {
  background-color: #f8fafc;
  font-weight: 600;
}
</style>
<body>
  
  <div class="notification-wrapper">
  <!-- Trigger Button -->
  <button class="notification-btn" id="bell-btn" aria-haspopup="true" aria-expanded="false">
    🔔
    <span class="badge">3</span>
  </button>

  <!-- Dropdown Menu Panel -->
  <div class="notification-dropdown" id="dropdown-menu">
    <div class="dropdown-header">
      <span>Notifications</span>
      <span class="clear-all">Mark all read</span>
    </div>
    <ul class="notification-list">
      <li class="unread">New comment on your post</li>
      <li>Your profile was updated</li>
      <li>Server backup completed</li>
    </ul>
  </div>
</div>


<script>
  const bellBtn = document.getElementById('bell-btn');
const dropdownMenu = document.getElementById('dropdown-menu');

bellBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  dropdownMenu.classList.toggle('active');
  const expanded = dropdownMenu.classList.contains('active');
  bellBtn.setAttribute('aria-expanded', expanded);
});

// Close dropdown when clicking outside
document.addEventListener('click', (e) => {
  if (!dropdownMenu.contains(e.target) && !bellBtn.contains(e.target)) {
    dropdownMenu.classList.remove('active');
    bellBtn.setAttribute('aria-expanded', 'false');
  }
});
</script>
</body>
</html>

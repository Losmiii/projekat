<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./assets/css/main.css">
    <script src="code.js" defer></script>
</head>
<body>

    <dialog id="modal">
        <h3>Create New Task</h3>

        <form action="#" method="DELETE">
                <input type="text" id="title" placeholder="Title">
            <small class="error" id="titleError"></small>

            <select class="priority-input" id="priority">
                <option selected value="">Choose Priority</option>
                <option value="Medium">Medium</option>
                <option value="High">High</option>
                <option value="Low">Low</option>
            </select>
            <small class="error" id="priorityError"></small>

            <select class="status-input" id="status">
                <option selected value="">Choose Status</option>
                <option value="Active">Active</option>
                <option value="Inactive">Inactive</option>
            </select>
            <small class="error" id="statusError"></small>

            <input type="text" id="createdBy" placeholder="Created by">
            <small class="error" id="createdByError"></small>

            <input type="date" id="dateAssigned">
            <small class="error" id="dateAssignedError"></small>

            <input type="date" id="dueDate">
            <small class="error" id="dueDateError"></small>

            <button id="addToTable" type="submit">Add Task</button>
            <button id="cancel">Cancel</button>
        </form>
    </dialog>

    <main class="container">
        <aside class="sidebar">
            <div class="logo">
                <p>UI</p>
            </div>

            <div class="icons">
                <img class="home-picture" src="./assets/imgs/house-solid-full.svg" alt="home icon" />
                <img class="home-picture" src="./assets/imgs/chart-bar-solid-full.svg" alt="chart icon" />
                <img class="home-picture" src="./assets/imgs/chart-pie-solid-full.svg" alt="chart pie icon" />
                <img class="home-picture" src="./assets/imgs/inbox-solid-full.svg" alt="inbox icon" />
                <img class="home-picture" src="./assets/imgs/moon-regular-full.svg" alt="change theme icon" />
                <img class="home-picture" src="./assets/imgs/gear-solid-full.svg" alt="settings icon" />
            </div>
        </aside>

        <section class="page">
            <header class="search-and-notifications">
                <div class="search">
                    <img class="search-icon" src="assets/imgs/magnifying-glass-solid-full.svg" alt="search icon">
                </div>
                <div class="notification">
                    <img src="assets/imgs/bell-regular-full.svg" alt="notification icon">
                </div>
                <div class="profile">
                    <img src="assets/imgs/user-regular-full.svg" alt="profile icon">
                </div>
            </header>

            <section class="content">
                <h1 class="table-name">My Tasks</h1>

                <div class="tasks">
                    <div>Assigned Tasks</div>
                    <div>Accepted Tasks</div>
                    <div>Review Tasks</div>
                </div>

                <section class="button-section">
                    <div>
                        <section class="dates-and-status">
                            <div>
                                <input class="date" id="filterDateAssigned" type="date" />
                            </div>
                            <div class="second-date">
                                <input class="due-date" id="filterDueDate" type="date" />
                            </div>
                            <div>
                                <select class="status" id="filterStatus">
                                    <option selected value="">Choose Status</option>
                                    <option value="Active">Active</option>
                                    <option value="Inactive">Inactive</option>
                                </select>
                            </div>
                            <div>
                                <button class="filter" onclick="filterTasks()">Filter</button>
                            </div>
                        </section>
                    </div>

                    <div>
                        <div class="new-task">
                            <div>
                                <button class="new-task-button"><span class="plus-task">&plus;</span> Create New Task</button>
                            </div>
                        </div>
                    </div>
                </section>

                <section class="table-section">
                    <table>
                        <thead>
                            <tr>
                                <th>Title</th>
                                <th>Priority</th>
                                <th>Status</th>
                                <th>Created by</th>
                                <th>Date Assigned</th>
                                <th>Due Date</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </section>

                <footer>
                    <div>
                        <p>Rows per page: </p>
                    </div>

                    <div>
                        <select class="page-number">
                            <option selected value="">1</option>
                            <option value="1">2</option>
                            <option value="0">3</option>
                        </select>
                    </div>

                    <div>
                        <p>1-50 of 100</p>
                    </div>

                    <div>
                        <img class="arrows" src="assets/imgs/angle-left-solid-full.svg" alt="">
                        <img class="arrows" src="assets/imgs/angle-right-solid-full.svg" alt="">
                    </div>
                </footer>
            </section>
        </section>
    </main>

</body>
</html>

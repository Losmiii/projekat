  <body>
    <dialog id="modal">
      <h3>Create New Task</h3>

      <form action="#">
        <input type="text" id="title" placeholder="Title" />
        <small class="error" id="titleError"></small>

        <select class="priority-input" id="priority">
          <option selected value="">Choose Priority</option>
          <option value="Medium">Medium</option>
          <option value="High">High</option>
          <option value="Low">Low</option>
        </select>
        <small class="error" id="priorityError"></small>

        <select class="status-input" id="status">
          <option selected value="">Choose Status</option>
          <option value="Active">Active</option>
          <option value="Inactive">Inactive</option>
        </select>
        <small class="error" id="statusError"></small>

        <input type="text" id="createdBy" placeholder="Created by" />
        <small class="error" id="createdByError"></small>

        <input type="date" id="dateAssigned" />
        <small class="error" id="dateAssignedError"></small>

        <input type="date" id="dueDate" />
        <small class="error" id="dueDateError"></small>

        <button id="addToTable" type="submit">Add Task</button>
        <button id="cancel" type="button">Cancel</button>
      </form>
    </dialog>

    </dialog>

        <section class="content">
          <h1 class="table-name">My Tasks</h1>

          <div class="tasks">
            <div>Assigned Tasks</div>
            <div>Accepted Tasks</div>
            <div>Review Tasks</div>
          </div>

          <section class="button-section">
            <div>
              <section class="dates-and-status">
                <div>
                  <input class="date" id="filterDateAssigned" type="date" />
                </div>
                <div class="second-date">
                  <input class="due-date" id="filterDueDate" type="date" />
                </div>
                <div>
                  <select class="status" id="filterStatus">
                    <option selected value="">All</option>
                    <option value="Active">Active</option>
                    <option value="Inactive">Inactive</option>
                  </select>
                </div>
                <div>
                  <button class="filter" id="filterBtn">Filter</button>
                </div>
              </section>
            </div>

            <div>
              <div class="new-task">
                <div>
                  <button class="new-task-button">
                    <span class="plus-task">&plus;</span> Create New Task
                  </button>
                </div>
              </div>
            </div>
          </section>

          <section class="table-section">
            <table id="taskTable">
              <thead>
                <tr>
                  <th>Title</th>
                  <th>Priority</th>
                  <th>Status</th>
                  <th>Created by</th>
                  <th>Date Assigned</th>
                  <th>Due Date</th>
                  <th></th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </section>

          <footer>
            <div>
              <p>Rows per page:</p>
            </div>

            <div>
              <select class="page-number" id="rowsSelect">
                <option selected value="4">4</option>
                <option value="8">8</option>
              </select>
            </div>

            <div>
              <p id="pageInfo">1-50 of 100</p>
            </div>

            <div>
              <img
                class="arrows"
                id="prevPage"
                src="assets/imgs/angle-left-solid-full.svg"
                alt=""
              />
              <img
                class="arrows"
                id="nextPage"
                src="assets/imgs/angle-right-solid-full.svg"
                alt=""
              />
            </div>
          </footer>
        </section>
